<style>
:root{
  box-sizing:border-box;
  --navy:#0b1420; --navy2:#101c2c; --gold:#c9a96a; --gold2:#e0c58b; --ink:#f6f2ea; --muted:#aab4c2;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:#060b12;color:var(--ink);font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;font-weight:300;display:flex;justify-content:center;padding:16px 14px 28px}
.card{width:100%;max-width:430px;background:var(--navy);border-radius:24px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.hero{position:relative;line-height:0}
.hero .photo{display:block;width:100%;height:auto;aspect-ratio:840/757;object-fit:cover}
.hero .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(11,20,32,.96) 0%,rgba(11,20,32,.55) 28%,rgba(11,20,32,0) 55%)}
.hero .logo{position:absolute;left:22px;bottom:46px;width:150px;height:auto}
.hero .curve{position:absolute;left:0;bottom:-1px;width:100%;height:58px}
.info{padding:6px 28px 30px}
h1{margin:0;font-weight:500;font-size:35px;line-height:1.08;color:var(--gold)}
h1 strong{display:block;font-weight:700;color:#fff;letter-spacing:.01em}
.bar{width:60px;height:2px;background:var(--gold);margin:18px 0 16px}
.role{margin:0 0 26px;font-size:20px;font-weight:300;color:#fff}
.rows{display:grid;gap:14px}
.row{display:flex;align-items:center;gap:16px;color:var(--ink);text-decoration:none;font-size:16.5px;font-weight:400;line-height:1.35;min-height:48px}
.ico{flex:none;width:46px;height:46px;border:1.5px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center}
.ico svg,.svc .ico svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.row:focus-visible,.btn:focus-visible{outline:2px solid var(--gold2);outline-offset:3px;border-radius:12px}
.tag{margin:30px 0 0;text-align:center;font-family:'Pinyon Script','Snell Roundhand',cursive;font-size:36px;line-height:1.1;color:var(--gold);transform:rotate(-3deg)}
.swoosh{display:block;width:70%;height:14px;margin:4px auto 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;min-height:52px;border-radius:12px;text-decoration:none;font-size:15.5px;font-weight:500;border:1.5px solid var(--gold);color:var(--gold2)}
.btn.primary{background:var(--gold);color:#0b1420;font-weight:600}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.back{background:var(--navy2);border-top:1px solid rgba(201,169,106,.45);padding:30px 22px 34px;text-align:center}
.back p{margin:0 0 24px;font-style:italic;font-size:18px;font-weight:300}
.svcs{display:grid;grid-template-columns:1fr 1px 1fr 1px 1fr;align-items:start}
.svcs i{background:rgba(201,169,106,.4);height:86px;align-self:center}
.svc{display:flex;flex-direction:column;align-items:center;gap:12px;font-size:14px;line-height:1.35;font-weight:400}
.svc .ico{width:60px;height:60px}
.svc .ico svg{width:28px;height:28px}
@media (prefers-reduced-motion:no-preference){.card{animation:in .7s ease both}@keyframes in{from{opacity:0}to{opacity:1}}}
@media (max-width:360px){h1{font-size:30px}.tag{font-size:30px}.svc{font-size:12.5px}}
</style>
</head>
